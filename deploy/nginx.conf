# TLS termination, WebSocket upgrade and a second layer of rate limiting in front of the app.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=600r/m;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 64k;

  location = /api/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://app:8787; include /etc/nginx/conf.d/proxy.inc; }
  location /api/             { limit_req zone=api burst=100 nodelay;  proxy_pass http://app:8787; include /etc/nginx/conf.d/proxy.inc; }

  # Live game state. Long read timeout: the server sends a frame every second.
  location /ws {
    proxy_pass http://app:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 75s;
  }

  location / { proxy_pass http://app:8787; include /etc/nginx/conf.d/proxy.inc; }
}
